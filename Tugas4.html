<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTIS Concert Ticket</title>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5e8d0;
            color: #17213c;
        }
        header {
            background: #101a3a;
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        header img {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #d62839;
        }
        header h1 {
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 650px;
            margin: 25px auto;
            background: #f8eedc;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #b8aa96;
        }
        h2 {
            color: #d62839;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #aaa;
            border-radius: 7px;
            background: #fffaf0;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 7px;
            background: #d62839;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #101a3a;
        }
        .radio {
            margin-top: 10px;
        }
        .radio input {
            width: auto;
        }
        #hasil {
            margin-top: 25px;
            padding: 20px;
            background: #101a3a;
            color: white;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>

<body>
<header>
    <img src="poyoyoi.jpg." alt="Logo">
    <div>
        <h1>CORTIS</h1>
        <p>Nama: Maria Chelsea Bebo | NIM: 255314051</p>
    </div>
</header>

<div class="container">
    <h2>CORTIS Concert Ticket</h2>

    <label>Nama Pemesan</label>
    <input type="text" id="nama" placeholder="Masukkan nama">

    <label>Jumlah Pilihan Tiket</label>
    <input type="number" id="jumlah" min="1" max="5"
           placeholder="1 - 5">

    <button onclick="buatPilihan()">OK</button>

    <div id="formPilihan"></div>
    <div id="formEmail"></div>
    <div id="hasil"></div>
</div>
<script>
    let pilihan = [];

    function buatPilihan() {
        let nama = document.getElementById("nama").value.trim();
        let jumlah = Number(document.getElementById("jumlah").value);
        let area = document.getElementById("formPilihan");

        if (nama === "") {
            alert("Nama harus diisi!");
            return;
        }

        if (isNaN(jumlah) || jumlah < 1 || jumlah > 5) {
            alert("Jumlah pilihan harus 1 sampai 5!");
            return;
        }
        area.innerHTML = "<h3>Masukkan Pilihan Tiket</h3>";
        for (let i = 0; i < jumlah; i++) {
            area.innerHTML += `
                <label>Pilihan ${i + 1}</label>
                <input type="text"
                       id="pilihan${i}"
                       placeholder="Contoh: VIP">
            `;
        }
        area.innerHTML += `
            <button onclick="buatMetode()">OK</button>
        `;
    }
    function buatMetode() {
        pilihan = [];

        let jumlah = Number(
            document.getElementById("jumlah").value
        );
        for (let i = 0; i < jumlah; i++) {
            let teks = document
                .getElementById("pilihan" + i)
                .value.trim();
            if (teks === "") {
                alert("Semua pilihan tiket harus diisi!");
                return;
            }
            pilihan.push(teks);
        }
        let area = document.getElementById("formEmail");
        let html = "<h3>Pilih Tiket</h3>";
        for (let i = 0; i < pilihan.length; i++) {
            html += `
                <div class="radio">
                    <input type="radio"
                           name="tiket"
                           value="${pilihan[i]}">
                    ${pilihan[i]}
                </div>
            `;
        }
        html += `
            <label>Atau pilih melalui Drop Down</label>
            <select id="dropdown">
                <option value="">-- Pilih Tiket --</option>
        `;
        for (let i = 0; i < pilihan.length; i++) {
            html += `
                <option value="${pilihan[i]}">
                    ${pilihan[i]}
                </option>
            `;
        }
        html += `
            </select>

            <label>Email</label>
            <input type="email" id="email"
                   placeholder="nama@email.com">

            <button onclick="proses()">Pesan Tiket</button>
        `;
        area.innerHTML = html;
    }
    function proses() {
        let email = document.getElementById("email").value.trim();
        let polaEmail = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

        if (!polaEmail.test(email)) {
            alert("Email tidak valid! Silakan masukkan ulang.");
            document.getElementById("email").focus();
            return;
        }
        let radio = document.querySelector(
            'input[name="tiket"]:checked'
        );
        let dropdown =
            document.getElementById("dropdown").value;
        let tiket = radio ? radio.value : dropdown;
        if (tiket === "") {
            alert("Silakan pilih tiket terlebih dahulu!");
            return;
        }
        let nama = document.getElementById("nama").value;
        let jumlah = document.getElementById("jumlah").value;
        let hasil = document.getElementById("hasil");

        hasil.style.display = "block";
        hasil.innerHTML = `
            <h3> Pemesanan Berhasil!</h3>
            <p>
                Alowww <b>${nama}</b>! 
                Email kamu <b>${email}</b>.
            </p>
            <p>
                Kamu punya <b>${jumlah}</b>
                pilihan tiket:
                <b>${pilihan.join(", ")}</b>.
            </p>
            <p>
                Kamu memilih tiket <b>${tiket}</b> 
            </p>
            <p>
                Tingkiyuuu udah pesan tiket CORTIS! 
                See you di konser! 
            </p>
        `;
    }
</script>
</body>
</html>
